# Environnement de developpement local. Trois services : la base Postgres,
# le backend AdonisJS et le frontend Nuxt. Aucune configuration de production
# ici (voir CLAUDE.md section 11 pour l'hebergement reel sur Render/Neon/Vercel).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lfdc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: le_fil_des_chapitres
    ports:
      - '5432:5432'
    volumes:
      # Volume nomme : les donnees survivent a un "docker compose down"
      # (mais pas a "docker compose down -v").
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Le backend attend cet etat "healthy" avant de demarrer (voir
      # depends_on ci-dessous) : sans ca, AdonisJS pourrait tenter de se
      # connecter avant que Postgres accepte des connexions.
      test: ['CMD-SHELL', 'pg_isready -U lfdc -d le_fil_des_chapitres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '3333:3333'
    volumes:
      # :Z relabelle le contenu monte avec le contexte SELinux attendu par
      # le conteneur (necessaire sur Fedora/RHEL en mode Enforcing, sinon
      # le process voit le dossier mais recoit "Permission denied").
      - ./backend:/app:Z
      # Volume anonyme dedie a node_modules : evite que le montage de la
      # ligne au-dessus n'ecrase les dependances installees dans l'image
      # (installees pour Linux/conteneur) par celles de l'hote.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
