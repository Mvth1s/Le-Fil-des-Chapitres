# Environnement de developpement local : la base Postgres, le backend
# AdonisJS, le frontend Nuxt et Adminer. Aucune configuration de production
# ici.
#
# Source unique des secrets : le fichier .env a la racine du depot (jamais
# versionne), lu automatiquement par docker compose pour l'interpolation des
# ${...}. Premier lancement : "cp .env.example .env", remplacer chaque
# marqueur, puis "docker compose up". La syntaxe ${VAR:?message} fait echouer
# compose avec un message clair si une variable manque ; ${VAR:-} marque une
# variable facultative (vide par defaut).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Superuser, reserve a l'initialisation et a l'administration.
      # L'application ne l'utilise jamais (voir docker/postgres/init).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env (voir .env.example)}
      # Mots de passe des trois roles applicatifs, lus par 01-roles.sh.
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD manquant dans .env (voir .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD manquant dans .env (voir .env.example)}
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:?DB_RO_PASSWORD manquant dans .env (voir .env.example)}
    ports:
      # Lie a 127.0.0.1 : la base n'est joignable que depuis cette machine,
      # pas depuis le reseau local (Docker contourne le pare-feu de l'hote).
      - '127.0.0.1:5432:5432'
    volumes:
      # Volume nomme : les donnees survivent a un "docker compose down"
      # (mais pas a "docker compose down -v").
      - postgres_data:/var/lib/postgresql/data
      # Scripts executes au PREMIER demarrage uniquement (volume vide) :
      # creation des roles lfdc_owner / lfdc_app / lfdc_ro et de la base.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,Z
      # Droits fins (DML pour app, SELECT pour ro), appeles par 01-roles.sh.
      - ./backend/database/sql/grants.sql:/sql/grants.sql:ro,Z
    healthcheck:
      # Le backend attend cet etat "healthy" avant de demarrer (voir
      # depends_on ci-dessous). -h 127.0.0.1 force le TCP : pendant
      # l'initialisation, l'image fait tourner un serveur temporaire qui
      # n'ecoute que sur le socket Unix, donc le check ne passe qu'une fois
      # 01-roles.sh termine et la base le_fil_des_chapitres creee.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d le_fil_des_chapitres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TZ: UTC
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?APP_KEY manquant dans .env (voir .env.example)}
      # DB_HOST=postgres : nom du service sur le reseau Docker interne.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: le_fil_des_chapitres
      # Compte du quotidien : DML uniquement.
      DB_USER: lfdc_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD manquant dans .env (voir .env.example)}
      # Compte des migrations (connexion Lucid "migration") : proprietaire.
      DB_MIGRATION_USER: lfdc_owner
      DB_MIGRATION_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD manquant dans .env (voir .env.example)}
      # Facultatif en local : vide = /api ouvert sans en-tete X-Api-Key.
      # Renseigne dans .env, le frontend envoie la meme valeur (NUXT_API_KEY).
      API_KEY: ${API_KEY:-}
    # Au demarrage, dans l'ordre :
    #   1. migrations en lfdc_owner (seul compte autorise a modifier le schema),
    #   2. seeders en lfdc_app (ils ne font que du DML, idempotents),
    #   3. serveur de dev. "exec" lui donne le PID 1 pour recevoir les signaux
    #      d'arret de docker directement.
    # "&&" : si une etape echoue, le serveur ne demarre pas.
    command:
      - sh
      - -c
      - node ace migration:run --connection=migration && node ace db:seed && exec node ace serve --hmr
    ports:
      # Publie pour les tests manuels de l'API (Postman, curl) ; le navigateur,
      # lui, passe par le proxy du frontend (reseau Docker interne). Lie a
      # 127.0.0.1 comme postgres : API_KEY etant vide en local, /api ne doit
      # pas etre joignable depuis le reseau local.
      - '127.0.0.1:3333:3333'
    volumes:
      # :Z relabelle le contenu monte avec le contexte SELinux attendu par
      # le conteneur (necessaire sur Fedora/RHEL en mode Enforcing, sinon
      # le process voit le dossier mais recoit "Permission denied").
      - ./backend:/app:Z
      # Volume anonyme dedie a node_modules : evite que le montage de la
      # ligne au-dessus n'ecrase les dependances installees dans l'image
      # (installees pour Linux/conteneur) par celles de l'hote.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Le navigateur ne parle qu'a Nuxt : le proxy Nitro (server/api) relaie
      # /api/** vers le backend par le reseau Docker interne.
      NUXT_API_UPSTREAM: http://backend:3333/api
      # Meme valeur que l'API_KEY du backend, ajoutee par le proxy dans
      # l'en-tete X-Api-Key. Vide par defaut : cle desactivee en dev.
      NUXT_API_KEY: ${API_KEY:-}
      # Basic Auth devant tout le frontend. Vides par defaut : desactivee en
      # dev (obligatoire en production, sur Vercel).
      NUXT_BASIC_AUTH_USER: ${NUXT_BASIC_AUTH_USER:-}
      NUXT_BASIC_AUTH_PASSWORD: ${NUXT_BASIC_AUTH_PASSWORD:-}
    ports:
      # Lie a 127.0.0.1 : en local, le proxy relaie /api sans cle ni Basic
      # Auth, le frontend ne doit pas etre joignable depuis le reseau local.
      - '127.0.0.1:3000:3000'
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    depends_on:
      - backend

  # Interface web pour consulter/modifier la base Postgres directement,
  # utile en developpement pour voir les donnees sans client desktop.
  # Jamais utilise en production.
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      # Lie a 127.0.0.1 pour la meme raison que postgres.
      - '127.0.0.1:8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
