name: CI

on:
  pull_request:
    branches: [dev, main]

env:
  NODE_VERSION: '22'

jobs:
  # Detecte quels dossiers ont change dans la PR. Ce job tourne toujours,
  # meme sur une PR "doc only" (CLAUDE.md, roadmap.md...) : c'est ce qui
  # permet au workflow de rapporter un statut meme quand tous les jobs
  # suivants sont skippes, necessaire pour un required status check fiable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # --- Backend : lint/typecheck -> test (vraie base Postgres) -> build ---

  backend-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  backend-test:
    needs: [changes, backend-checks]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lfdc
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: le_fil_des_chapitres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfdc -d le_fil_des_chapitres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: lfdc
      DB_PASSWORD: changeme
      DB_DATABASE: le_fil_des_chapitres
      NODE_ENV: test
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TZ: UTC
      # Cle fixe, environnement CI ephemere : aucune donnee reelle a proteger.
      APP_KEY: uXh4GRvtbnKBB82ul4pd_2I84bPtCQ4_
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node ace migration:run --force
      - run: node ace db:seed
      - run: node ace test

  backend-build:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  # --- Frontend : lint/typecheck -> test (Vitest) -> build ---

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  frontend-test:
    needs: [changes, frontend-checks]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    needs: [changes, frontend-test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
